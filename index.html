<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <div class="planet planet-left"></div>
    <div class="planet planet-right"></div>

    <div class="moon"></div>

    <div class="ufo">
        🛸
    </div>

    <div class="rocket">
        🚀
    </div>

    <div class="astronaut">
        👨‍🚀
    </div>

    <div class="asteroid asteroid-1">●</div>
    <div class="asteroid asteroid-2">●</div>
    <div class="asteroid asteroid-3">●</div>

    <main class="container">

        <div class="title">
            <span>We're Getting</span>
            <strong>Ready</strong>
        </div>

        <div class="clock">

            <div class="time-box hour-box">
                <div id="hour">00</div>
                <small>HOURS</small>
            </div>

            <span class="separator">:</span>

            <div class="time-box minute-box">
                <div id="minute">00</div>
                <small>MINUTES</small>
            </div>

            <span class="separator">:</span>

            <div class="time-box second-box">
                <div id="seconds">00</div>
                <small>SECONDS</small>
            </div>

        </div>

        <p class="description">
            Time keeps moving through the universe.
            <br>
            Enjoy every second of your journey.
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
